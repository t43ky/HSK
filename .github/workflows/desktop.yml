# Windows 앱 빌드: desktop/ 이 바뀌면 Windows에서 빌드해 Releases에 zip을 올림
# (desktop/package.json 의 version 으로 desktop-vX.Y.Z 릴리스를 만들거나 덮어씀)
name: Windows 앱
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 버전
        id: v
        shell: bash
        run: echo "v=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 빌드
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-packager . HSK --platform=win32 --arch=x64 --out=out --overwrite --ignore="^/out" --ignore="^/node_modules" --icon=icon.ico --app-copyright="t43ky" --win32metadata.FileDescription="HSK 단어장" --win32metadata.ProductName="HSK 단어장"
          Compress-Archive -Path out/HSK-win32-x64 -DestinationPath out/HSK-Windows-x64.zip
      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: HSK 단어장 Windows 앱 v${{ steps.v.outputs.v }}
          body: |
            1. 아래 HSK-Windows-x64.zip 을 받아 압축을 풉니다.
            2. 폴더 안의 HSK.exe 를 실행합니다. (처음엔 "Windows의 PC 보호" 창이 뜨면 '추가 정보' → '실행')
            앱 내용은 실행할 때마다 최신 웹 버전으로 자동 업데이트됩니다.
          files: desktop/out/HSK-Windows-x64.zip
